name: Build TOTAL Profiler Native Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/TotalProfiler/**'
      - 'components/**'
      - '.gitattributes'
      - 'README.md'
      - 'VERSION.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled profiler payload bytes
        shell: pwsh
        run: |
          $checks = @{
            'components\cet\PAYLOAD\0-Engine\modules\Scheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'components\cet\PAYLOAD\0-Engine\modules\CETProfilerScheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'components\grsp\red4ext\plugins\redscript_profiler_alpha.dll' = '58b6caa3dccb03067d17a5d40ac049ba90cb74862b4302d7d2b5f91c5fca415d'
          }
          foreach ($path in $checks.Keys) {
            if (!(Test-Path $path)) { throw "Bundled profiler payload missing: $path" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            $expected = $checks[$path]
            if ($actual -ne $expected) {
              throw "Bundled profiler payload hash mismatch: $path expected=$expected actual=$actual"
            }
            Write-Host "OK $path $actual"
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet restore src\TotalProfiler\TotalProfiler.csproj
          dotnet publish src\TotalProfiler\TotalProfiler.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Bundle latest official CapFrameX portable release
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'Gs-Cyberpunk2077-TOTAL-Profiler-build' }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/CXWorld/CapFrameX/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '_portable\.zip$' } | Select-Object -First 1
          if ($null -eq $asset) { throw 'Latest CapFrameX release has no portable ZIP asset.' }

          Write-Host "Bundling official CapFrameX release $($release.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile capframex-portable.zip

          if ($asset.digest -and $asset.digest -match '^sha256:(.+)$') {
            $expected = $Matches[1].ToLower()
            $actual = (Get-FileHash capframex-portable.zip -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              throw "CapFrameX package hash mismatch. expected=$expected actual=$actual"
            }
            Write-Host "CapFrameX upstream SHA256 verified: $actual"
          }

          New-Item -ItemType Directory -Force -Path capx-extract | Out-Null
          Expand-Archive capframex-portable.zip -DestinationPath capx-extract -Force
          $capExe = Get-ChildItem capx-extract -Filter CapFrameX.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $capExe) { throw 'CapFrameX.exe not found in official portable release.' }

          $dest = 'publish\Tools\CapFrameX'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $capExe.Directory.FullName '*') $dest -Recurse -Force

          $third = 'publish\THIRD_PARTY\CapFrameX'
          New-Item -ItemType Directory -Force -Path $third | Out-Null
          $licenseUrl = "https://raw.githubusercontent.com/CXWorld/CapFrameX/$($release.tag_name)/LICENSE"
          Invoke-WebRequest -Uri $licenseUrl -Headers $headers -OutFile (Join-Path $third 'LICENSE.txt')

          @(
            'CapFrameX is a third-party open-source project and is not part of TOTAL Profiler.'
            'Upstream: https://github.com/CXWorld/CapFrameX'
            "Bundled release: $($release.tag_name)"
            "Bundled asset: $($asset.name)"
            "Upstream asset digest: $($asset.digest)"
            "Release URL: $($release.html_url)"
            'TOTAL Profiler does not require this specific CapFrameX version; users may link an existing compatible CapFrameX.exe.'
          ) | Set-Content -Encoding UTF8 (Join-Path $third 'SOURCE.txt')

      - name: Verify native package
        shell: pwsh
        run: |
          if (!(Test-Path 'publish\Gs-Cyberpunk2077-TOTAL-Profiler.exe')) { throw 'Native EXE missing' }
          if (Test-Path 'publish\total_profiler.py') { throw 'Python controller unexpectedly present' }
          if (!(Test-Path 'publish\components\grsp\red4ext\plugins\redscript_profiler_alpha.dll')) { throw 'GRSP payload missing' }
          if (!(Test-Path 'publish\components\cet\CET_Manager_Core.ps1')) { throw 'CET manager missing' }
          if (!(Test-Path 'publish\Tools\CapFrameX\CapFrameX.exe')) { throw 'Bundled CapFrameX missing' }
          if (!(Test-Path 'publish\THIRD_PARTY\CapFrameX\LICENSE.txt')) { throw 'CapFrameX license notice missing' }

          $checks = @{
            'publish\components\cet\PAYLOAD\0-Engine\modules\Scheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'publish\components\cet\PAYLOAD\0-Engine\modules\CETProfilerScheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'publish\components\grsp\red4ext\plugins\redscript_profiler_alpha.dll' = '58b6caa3dccb03067d17a5d40ac049ba90cb74862b4302d7d2b5f91c5fca415d'
          }
          foreach ($path in $checks.Keys) {
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $checks[$path]) { throw "Published payload hash mismatch: $path" }
          }

      - name: Stage transparent portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item publish\* stage\ -Recurse
          Copy-Item README.md stage\README.md
          Copy-Item VERSION.txt stage\VERSION.txt
          Copy-Item THIRD_PARTY_NOTICE.txt stage\THIRD_PARTY_NOTICE.txt
          @(
            "G's Cyberpunk 2077 TOTAL Profiler"
            'Version: 0.2.2'
            "Git commit: $env:GITHUB_SHA"
            'Runtime: .NET 8 self-contained win-x64'
            'Packaging: normal self-contained .NET files; NOT PyInstaller; NOT self-extracting'
            'Python required: no'
            '.NET installation required for TOTAL Profiler: no'
            'Bundled profiler payload hashes: verified during build'
            'CapFrameX: latest official upstream portable release bundled at build time; existing compatible versions may be linked instead'
          ) | Set-Content -Encoding UTF8 stage\BUILD_INFO.txt

          Push-Location stage
          Get-ChildItem -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $relative"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt
          Pop-Location

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gs-Cyberpunk2077-TOTAL-Profiler-0.2.2-NATIVE-Windows-x64
          path: stage
