name: Build TOTAL Profiler Native Windows App

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/TotalProfiler/**'
      - 'components/**'
      - '.gitattributes'
      - 'README.md'
      - 'tools/**'
      - 'patches/**'
      - 'VERSION.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled profiler payload bytes
        shell: pwsh
        run: |
          $checks = @{
            'components\cet\PAYLOAD\0-Engine\modules\Scheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'components\cet\PAYLOAD\0-Engine\modules\CETProfilerScheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'components\grsp\red4ext\plugins\redscript_profiler_alpha.dll' = '58b6caa3dccb03067d17a5d40ac049ba90cb74862b4302d7d2b5f91c5fca415d'
          }
          foreach ($path in $checks.Keys) {
            if (!(Test-Path $path)) { throw "Bundled profiler payload missing: $path" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            $expected = $checks[$path]
            if ($actual -ne $expected) {
              throw "Bundled profiler payload hash mismatch: $path expected=$expected actual=$actual"
            }
            Write-Host "OK $path $actual"
          }

      - name: Parse CET manager PowerShell
        shell: pwsh
        run: |
          $path = (Resolve-Path 'components\cet\CET_Manager_Core.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "CET manager PowerShell syntax validation failed."
          }
          Write-Host "CET manager PowerShell syntax OK."

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet restore src\TotalProfiler\TotalProfiler.csproj
          dotnet publish src\TotalProfiler\TotalProfiler.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Bundle official CapFrameX 1.9.1 beta portable release
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'Gs-Cyberpunk2077-TOTAL-Profiler-build' }
          $tag = 'v1.9.1_beta'
          $assetUrl = 'https://github.com/CXWorld/CapFrameX/releases/download/v1.9.1_beta/CapFrameX_1.9.1.2_Beta_Portable.zip'
          $expected = 'acd8f82598bc794d8f666996eb8157c445c05af0fc04c9e4129e4ac76bf1086a'

          Write-Host "Bundling official CapFrameX $tag portable release"
          Invoke-WebRequest -Uri $assetUrl -Headers $headers -OutFile capframex-portable.zip
          $actual = (Get-FileHash capframex-portable.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "CapFrameX package hash mismatch. expected=$expected actual=$actual"
          }
          Write-Host "CapFrameX upstream SHA256 verified: $actual"

          New-Item -ItemType Directory -Force -Path capx-extract | Out-Null
          Expand-Archive capframex-portable.zip -DestinationPath capx-extract -Force
          $capExe = Get-ChildItem capx-extract -Filter CapFrameX.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $capExe) { throw 'CapFrameX.exe not found in official portable release.' }

          $dest = 'publish\Tools\CapFrameX'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $capExe.Directory.FullName '*') $dest -Recurse -Force

          # Make the bundled upstream portable release ACTUALLY run in portable mode.
          # CapFrameX detects this only from portable.json beside CapFrameX.exe.
          $portable = [ordered]@{
            portable = $true
            paths = [ordered]@{
              config = './Portable/Config'
              captures = './Portable/Captures'
              screenshots = './Portable/Screenshots'
              logs = './Portable/Logs'
              cloud = './Portable/Captures/Cloud'
            }
          }
          $portable | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $dest 'portable.json')

          $cfgDir = Join-Path $dest 'Portable\Config'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'Portable\Captures') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'Portable\Screenshots') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'Portable\Logs') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'Portable\Captures\Cloud') | Out-Null

          # Seed only TOTAL Profiler's required capture controls.
          # CapFrameX supplies all other settings from its own defaults.
          # Keep the Double literals explicit. PowerShell ConvertTo-Json serializes 0.0 as 0,
          # but CapFrameX 1.9.1 beta strictly expects Double for CaptureTime/CaptureDelay.
          $appSettingsPath = Join-Path $cfgDir 'AppSettings.json'
          @(
            '{'
            '  "CaptureHotKey": "F11",'
            '  "CaptureTime": 0.0,'
            '  "CaptureDelay": 0.0'
            '}'
          ) | Set-Content -Encoding UTF8 $appSettingsPath
          $seeded = Get-Content $appSettingsPath -Raw
          if ($seeded -notmatch '"CaptureTime"\s*:\s*0\.0') { throw 'CapFrameX CaptureTime must be emitted as JSON Double literal 0.0' }
          if ($seeded -notmatch '"CaptureDelay"\s*:\s*0\.0') { throw 'CapFrameX CaptureDelay must be emitted as JSON Double literal 0.0' }

          $third = 'publish\THIRD_PARTY\CapFrameX'
          New-Item -ItemType Directory -Force -Path $third | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/CXWorld/CapFrameX/v1.9.0/LICENSE' -Headers $headers -OutFile (Join-Path $third 'LICENSE.txt')

          @(
            'CapFrameX is a third-party open-source project and is not part of TOTAL Profiler.'
            'Upstream: https://github.com/CXWorld/CapFrameX'
            'Bundled release: v1.9.1_beta (build 1.9.1.2 Beta)'
            'Bundled asset: CapFrameX_1.9.1.2_Beta_Portable.zip'
            'Upstream asset SHA256: acd8f82598bc794d8f666996eb8157c445c05af0fc04c9e4129e4ac76bf1086a'
            'Release URL: https://github.com/CXWorld/CapFrameX/releases/tag/v1.9.1_beta'
            'Runtime: CapFrameX 1.9.0 requires .NET 10 Desktop Runtime.'
            'TOTAL Profiler does not version-lock CapFrameX; users may link an existing compatible CapFrameX.exe instead.'
          ) | Set-Content -Encoding UTF8 (Join-Path $third 'SOURCE.txt')

      - name: Verify native package
        shell: pwsh
        run: |
          if (!(Test-Path 'publish\Gs-Cyberpunk2077-TOTAL-Profiler.exe')) { throw 'Native EXE missing' }
          if (Test-Path 'publish\total_profiler.py') { throw 'Python controller unexpectedly present' }
          if (!(Test-Path 'publish\components\grsp\red4ext\plugins\redscript_profiler_alpha.dll')) { throw 'GRSP payload missing' }
          if (!(Test-Path 'publish\components\cet\CET_Manager_Core.ps1')) { throw 'CET manager missing' }
          if (!(Test-Path 'publish\Tools\CapFrameX\CapFrameX.exe')) { throw 'Bundled CapFrameX missing' }
          if (!(Test-Path 'publish\Tools\CapFrameX\portable.json')) { throw 'Bundled CapFrameX portable.json missing' }
          if (!(Test-Path 'publish\Tools\CapFrameX\Portable\Config\AppSettings.json')) { throw 'Bundled CapFrameX TOTAL Profiler settings missing' }
          if (!(Test-Path 'publish\Tools\CapFrameX\Portable\Captures')) { throw 'Bundled CapFrameX Portable/Captures missing' }
          if (!(Test-Path 'publish\THIRD_PARTY\CapFrameX\LICENSE.txt')) { throw 'CapFrameX license notice missing' }

          $checks = @{
            'publish\components\cet\PAYLOAD\0-Engine\modules\Scheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'publish\components\cet\PAYLOAD\0-Engine\modules\CETProfilerScheduler.lua' = '4030ef6d8fa743f7a4accf00406c2110f70162261232b564469d3eaa0b7c78cb'
            'publish\components\grsp\red4ext\plugins\redscript_profiler_alpha.dll' = '58b6caa3dccb03067d17a5d40ac049ba90cb74862b4302d7d2b5f91c5fca415d'
          }
          foreach ($path in $checks.Keys) {
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $checks[$path]) { throw "Published payload hash mismatch: $path" }
          }

      - name: Stage transparent portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item publish\* stage\ -Recurse
          Copy-Item README.md stage\README.md
          Copy-Item VERSION.txt stage\VERSION.txt
          Copy-Item THIRD_PARTY_NOTICE.txt stage\THIRD_PARTY_NOTICE.txt
          @(
            "G's Cyberpunk 2077 TOTAL Profiler"
            'Version: 0.2.20'
            "Git commit: $env:GITHUB_SHA"
            'Runtime: .NET 8 self-contained win-x64'
            'Packaging: normal self-contained .NET files; NOT PyInstaller; NOT self-extracting'
            'Python required: no'
            '.NET installation required for TOTAL Profiler: no'
            'Bundled profiler payload hashes: verified during build'
            'CapFrameX: upstream official portable v1.9.1 beta build 1.9.1.2; real portable.json; F11; CaptureTime=0 unlimited; bundled captures Tools/CapFrameX/Portable/Captures'
          ) | Set-Content -Encoding UTF8 stage\BUILD_INFO.txt

          Push-Location stage
          Get-ChildItem -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $relative"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt
          Pop-Location

      - name: Upload Windows artifact
        id: upload_public_artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCTP-GCyberpunkTotalProfiler
          path: stage

      # PUBLIC DISTRIBUTION RULE:
      # Do not re-zip stage locally for Releases. The browser-clean package is the
      # archive GitHub itself creates for the Actions artifact. Download those exact
      # bytes back from GitHub and attach that archive unchanged to the Release.
      - name: Fetch exact GitHub artifact archive for public release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_public_artifact.outputs.artifact-id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_ID)) { throw 'upload-artifact did not return an artifact id.' }

          $asset = 'Gs_Cyberpunk2077_TOTAL_Profiler_v0.2.20.zip'
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"

          curl.exe -fL -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" $uri -o $asset

          if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw 'GitHub artifact archive download failed.' }
          $size = (Get-Item -LiteralPath $asset).Length
          if ($size -lt 1000000) { throw "Downloaded GitHub artifact archive is unexpectedly small: $size bytes" }

          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ASCII "$asset.sha256.txt"
          "PUBLIC_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUBLIC_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Exact GitHub artifact archive: $asset"
          Write-Host "SHA256: $hash"

      - name: Publish exact artifact archive as GitHub prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.2.20-public'
          $title = "G's Cyberpunk 2077 TOTAL Profiler v0.2.20"
          $asset = $env:PUBLIC_ASSET
          $shaAsset = "$asset.sha256.txt"

          $notes = @(
            "Public Windows build of G's Cyberpunk 2077 TOTAL Profiler v0.2.20."
            ""
            "Distribution note:"
            "- C# / .NET 8 self-contained win-x64"
            "- normal transparent multi-file package"
            "- no Python"
            "- no PyInstaller"
            "- no UPX"
            "- no self-extracting wrapper"
            "- this Release ZIP is the exact archive generated and served by GitHub Actions for the successful build artifact; it is not re-packed locally"
            ""
            "SHA-256:"
            $env:PUBLIC_SHA256
          ) -join [Environment]::NewLine

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub prerelease.' }
          }
          else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not update GitHub prerelease.' }
          }

          gh release upload $tag $asset $shaAsset --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload public Release assets.' }

          Write-Host "Published exact GitHub artifact archive to prerelease $tag"
