name: Build TOTAL Profiler Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - 'total_profiler.py'
      - 'components/**'
      - 'README.md'
      - 'VERSION.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PyInstaller
        run: python -m pip install "pyinstaller==6.22.3"

      - name: Syntax check
        run: |
          python -m py_compile total_profiler.py
          python -m py_compile components\correlator\GRSP_Correlator.py

      - name: Build one-folder Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --noupx `
            --name "Gs-Cyberpunk2077-TOTAL-Profiler" `
            --add-data "components;components" `
            total_profiler.py

      - name: Stage transparent portable package
        shell: pwsh
        run: |
          $dest = "stage\Gs-Cyberpunk2077-TOTAL-Profiler"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "dist\Gs-Cyberpunk2077-TOTAL-Profiler\*" $dest -Recurse
          Copy-Item README.md $dest\README.md
          Copy-Item VERSION.txt $dest\VERSION.txt
          Copy-Item THIRD_PARTY_NOTICE.txt $dest\THIRD_PARTY_NOTICE.txt

          @(
            "G's Cyberpunk 2077 TOTAL Profiler"
            "Version: 0.1.1"
            "Git commit: $env:GITHUB_SHA"
            "Python: 3.12"
            "PyInstaller: 6.22.3"
            "Build type: onedir / windowed / no UPX"
          ) | Set-Content -Encoding UTF8 "$dest\BUILD_INFO.txt"

          Push-Location $dest
          Get-ChildItem -File -Recurse |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $relative"
            } | Set-Content -Encoding ASCII "SHA256SUMS.txt"
          Pop-Location

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gs-Cyberpunk2077-TOTAL-Profiler-0.1.1-Windows-x64-PORTABLE
          path: stage/Gs-Cyberpunk2077-TOTAL-Profiler
